<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Milk Collection App</title>
    <meta name="description" content="Offline-capable milk collection management system" />
    
    <!-- PWA Native-like Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="background-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milk Collect" />
    <meta name="application-name" content="Milk Collect" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#10b981" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Prevent text selection on mobile for native feel -->
    <meta name="touch-callout" content="none" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons (no <link rel="preload"> here — they were causing "preloaded but not used" warnings on / and /settings) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    
    <!-- Preconnect to APIs for faster requests -->
    <link rel="preconnect" href="https://2backend.maddasystems.co.ke" crossorigin />
    <link rel="dns-prefetch" href="https://2backend.maddasystems.co.ke" />
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    
    <!-- Critical CSS for instant paint -->
    <style>
      /* Prevent FOUC and layout shift */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        background: #f9fafb;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
      }
      
      /* Native-like touch behavior */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      
      /* Disable scrolling on body */
      html {
        -webkit-overflow-scrolling: touch;
      }
      
      /* Safe area support for notched devices */
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
      }
      
      /* Initial loading state */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Hide scrollbars for native feel */
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      
      /* Selection color */
      ::selection {
        background: #10b98133;
      }

      /* Native startup diagnostic shown only if the JS bundle never mounts React. */
      #root.boot-timeout {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        background: #f9fafb;
      }

      .boot-timeout-panel {
        max-width: 420px;
        width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #ffffff;
        color: #111827;
        padding: 20px;
        box-shadow: 0 16px 40px #1118271a;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .boot-timeout-panel strong {
        display: block;
        font-size: 18px;
        margin-bottom: 8px;
      }

      .boot-timeout-panel span {
        display: block;
        font-size: 14px;
        line-height: 1.45;
        color: #4b5563;
      }
    </style>
    
    <!-- OG Tags -->
    <meta property="og:title" content="Milk Collection App" />
    <meta property="og:description" content="Offline-capable milk collection management system" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
  </head>

  <body>
    <script>
      // v2.11.10 — Capacitor bridge JS-API polyfill.
      // On Android 7 / WebView 51-52 the injected native-bridge.js can attach
      // AFTER the legacy bundle has already begun evaluating, so calls made by
      // Bridge.java via evaluateJavascript() ("window.Capacitor.triggerEvent(...)"
      // and friends) throw TypeError, poisoning plugin registration (BluetoothLe
      // then reports "not implemented on android" and psettings never populates).
      // We install harmless no-op stubs BEFORE anything else runs. If the real
      // native-bridge.js loads later it overwrites these; if it never loads the
      // stubs keep the bridge eval calls from crashing.
      (function () {
        try {
          if (!window.Capacitor) {
            window.Capacitor = { platform: 'web', isNative: false };
          }
          var cap = window.Capacitor;
          if (typeof cap.triggerEvent !== 'function') {
            cap.triggerEvent = function () { /* no-op fallback */ return false; };
          }
          if (typeof cap.fromNative !== 'function') {
            cap.fromNative = function () { /* no-op fallback */ };
          }
          if (typeof cap.handleWindowError !== 'function') {
            cap.handleWindowError = function () { /* no-op fallback */ };
          }
        } catch (e) {
          // Never let the polyfill block boot.
        }
      })();

      window.__DELICOOP_BOOT = {
        htmlLoadedAt: Date.now(),
        moduleStarted: false,
        renderRequested: false
      };



      window.addEventListener('DOMContentLoaded', function () {
        window.setTimeout(function () {
          var root = document.getElementById('root');
          var boot = window.__DELICOOP_BOOT || {};

          if (!root || root.hasChildNodes() || boot.renderRequested) {
            return;
          }

          var message = boot.moduleStarted
            ? 'The JavaScript bundle loaded, but React render was not requested. Check main.tsx startup logs.'
            : 'The JavaScript bundle did not start. Check Android asset sync, WebView console errors, and packaged JS files.';

          root.className = (root.className ? root.className + ' ' : '') + 'boot-timeout';
          root.innerHTML = '<div class="boot-timeout-panel"><strong>App startup blocked</strong><span>' + message + '</span></div>';
          console.error('[BOOT] React did not render before timeout:', message);
        }, 8000);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker registration is guarded in src/main.tsx so native Capacitor never registers /sw.js. -->
  </body>
</html>
